<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — TaskApp</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard">
    <div class="topbar">
      <h1 id="greeting">My Tasks</h1>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="add-form">
      <input type="text" id="taskInput" placeholder="Add a new task..." />
      <button onclick="addTask()">Add</button>
    </div>

    <div class="task-list" id="taskList">
      <p class="empty">Loading tasks...</p>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const name = localStorage.getItem('name');
    if (!token) location.href = 'index.html';

    document.getElementById('greeting').textContent = `Hi ${name} 👋`;

    const headers = {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`
    };

    async function loadTasks() {
      const res = await fetch('http://localhost:5000/api/tasks', { headers });
      const tasks = await res.json();
      const list = document.getElementById('taskList');

      if (tasks.length === 0) {
        list.innerHTML = '<p class="empty">No tasks yet. Add one above!</p>';
        return;
      }

      list.innerHTML = tasks.map(task => `
        <div class="task-item ${task.completed ? 'done' : ''}" id="task-${task.id}">
          <input type="checkbox" ${task.completed ? 'checked' : ''}
            onchange="toggleTask('${task.id}', this.checked)" />
          <span class="task-title">${task.title}</span>
          <button class="delete-btn" onclick="deleteTask('${task.id}')">×</button>
        </div>
      `).join('');
    }

    async function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;

      await fetch('http://localhost:5000/api/tasks', {
        method: 'POST',
        headers,
        body: JSON.stringify({ title: input.value })
      });

      input.value = '';
      loadTasks();
    }

    async function toggleTask(id, completed) {
      await fetch(`http://localhost:5000/api/tasks/${id}`, {
        method: 'PUT',
        headers,
        body: JSON.stringify({ completed })
      });
      loadTasks();
    }

    async function deleteTask(id) {
      await fetch(`http://localhost:5000/api/tasks/${id}`, {
        method: 'DELETE',
        headers
      });
      loadTasks();
    }

    function logout() {
      localStorage.clear();
      location.href = 'index.html';
    }

    // add task on Enter key
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    loadTasks();
  </script>
</body>
</html>
